name: GhostMaintainer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker pull python:3.12-slim
      - run: python -m unittest -v
        env:
          GHOST_TEST_BACKEND: docker
      - run: python ghostmaintainer.py eval --backend docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-evidence
          path: runs/
